name: flake-check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3
        with:
          extra-conf: |
            extra-substituters = https://nkl-sofka.cachix.org
            extra-trusted-public-keys = nkl-sofka.cachix.org-1:hLg9frFNJynrxe7SSBb/p6pbawlpZmG10bw+wLsTufw=

      - name: Evaluate every host on every system
        run: nix flake check --all-systems --no-build

      - name: Check formatting
        run: nix fmt -- --ci

      # Without --all-systems this builds exactly the x86_64-linux checks,
      # which checks.nix has already filtered to the native hosts.
      - name: Build native checks
        run: nix flake check -L

  macos:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3
        with:
          extra-conf: |
            extra-substituters = https://nkl-sofka.cachix.org
            extra-trusted-public-keys = nkl-sofka.cachix.org-1:hLg9frFNJynrxe7SSBb/p6pbawlpZmG10bw+wLsTufw=

      - name: Build native checks
        run: nix flake check -L
