name: flake-check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3
        with:
          extra-conf: |
            extra-substituters = https://nkl-sofka.cachix.org
            extra-trusted-public-keys = nkl-sofka.cachix.org-1:hLg9frFNJynrxe7SSBb/p6pbawlpZmG10bw+wLsTufw=

      - name: Evaluate every host on every system
        run: nix flake check --all-systems --no-build

      - name: Check formatting
        run: nix fmt -- --ci

      - name: Lint scripts, workflows, and task files
        run: |
          nix build --no-link -L \
            .#checks.x86_64-linux.shellcheck \
            .#checks.x86_64-linux.actionlint \
            .#checks.x86_64-linux.just \
            .#checks.x86_64-linux.zsh-syntax
